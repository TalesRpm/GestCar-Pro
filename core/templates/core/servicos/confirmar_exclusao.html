{% extends 'core/base.html' %}

{% block content %}

<h2>Confirmar Exclusão</h2>

<p>Deseja excluir o serviço <strong>{{ servico.nome }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sim, excluir</button>
    <a href="{% url 'listar_servicos' %}" class="btn btn-secondary">Cancelar</a>
</form>

{% endblock %}
