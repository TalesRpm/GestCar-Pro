{% load static %}


<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <title>GestCar Pro - Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>

        body{
            margin:0;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
            radial-gradient(circle at top,
            #1e293b 0%,
            #0f172a 45%,
            #020617 100%);
            font-family:'Segoe UI',sans-serif;
        }

        .login-card{

            width:460px;
            padding:40px;
            border-radius:24px;

            background:#111827;

            border:1px solid rgba(255,255,255,.05);

            box-shadow:
            0 20px 50px rgba(0,0,0,.35);

        }

        @keyframes fadeLogin{

        from{

        opacity:0;
        transform:translateY(25px);

        }

        to{

        opacity:1;
        transform:translateY(0);

        }

        }

        .login-card{

        animation:fadeLogin .6s ease;

        }

        .logo-icon{

            width:80px;
            height:80px;

            border-radius:20px;

            background:linear-gradient(
            135deg,
            #f97316,
            #fb923c
            );

            display:flex;
            align-items:center;
            justify-content:center;

            margin:0 auto 20px auto;

            font-size:36px;
            color:white;

            box-shadow:
            0 10px 30px rgba(249,115,22,.35);

        }

        .title{

            color:white;
            font-size:30px;
            font-weight:700;

            text-align:center;

            margin-bottom:4px;

        }

        .subtitle{

            color:#94a3b8;
            text-align:center;
            margin-bottom:35px;

        }

        .form-label{

            color:#cbd5e1;

        }

        .form-control{

            background:#0f172a;
            border:1px solid rgba(255,255,255,.08);
            color:white;

            border-radius:14px;

            height:52px;

        }

        .form-control:focus{

            background:#0f172a;
            color:white;

            border-color:#f97316;

            box-shadow:
            0 0 0 4px rgba(249,115,22,.15);

        }

        .form-control::placeholder{

            color:#64748b;

        }

        .input-group-text{

            background:#0f172a;
            border:1px solid rgba(255,255,255,.08);
            color:#94a3b8;

        }

        .btn-login{

            background:#f97316;
            border:none;

            height:52px;

            border-radius:14px;

            font-weight:600;

            color:white;

        }

        .btn-login:hover{

            background:#ea580c;

        }

        .footer-text{

            color:#64748b;
            text-align:center;
            font-size:13px;

            margin-top:20px;

        }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    input:-webkit-autofill:active{

    -webkit-box-shadow:0 0 0 1000px #0f172a inset !important;

    -webkit-text-fill-color:white !important;

    caret-color:white;

} 




    </style>

</head>

<body>

<div class="login-card">

    <div class="text-center mb-4">
    <img src="{% static 'img/logogestcar.png' %}"
    style="width:180px;">
    </div>

    <div class="title">
        GestCar Pro
    </div>

    <div class="subtitle">
        Gestão Automotiva
    </div>

    <form
    method="post"
    onsubmit="loadingLogin()">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Usuário
            </label>

            <div class="input-group">

                <span class="input-group-text">
                    <i class="bi bi-person"></i>
                </span>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Digite seu usuário"
                    required
                    autofocus>

            </div>

        </div>

        <div class="mb-4">

    <label class="form-label">

        Senha

    </label>

    <div class="input-group">

        <span class="input-group-text">

            <i class="bi bi-lock"></i>

        </span>

        <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Digite sua senha"
            required>

        <button
            class="input-group-text"
            type="button"
            onclick="mostrarSenha()"
            style="cursor:pointer;">

            <i
                id="iconeSenha"
                class="bi bi-eye"></i>

        </button>

    </div>

</div>

        <button
        id="btnLogin"
        type="submit"
        class="btn btn-login w-100">

        <i class="bi bi-box-arrow-in-right me-2"></i>

        Entrar

    </button>

        {% if form.errors %}

        <div class="alert alert-danger mt-4 mb-0">

            Usuário ou senha inválidos.

        </div>

        {% endif %}

    </form>

    <div class="footer-text">
    GestCar Pro © {% now "Y" %}
    <br>
    Sistema de Gestão Automotiva
</div>

</div>

    <script>

function mostrarSenha(){

    const senha = document.getElementById("password");
    const icone = document.getElementById("iconeSenha");

    if(senha.type==="password"){

        senha.type="text";
        icone.className="bi bi-eye-slash";

    }else{

        senha.type="password";
        icone.className="bi bi-eye";

    }

}

function loadingLogin(){

    const botao = document.getElementById("btnLogin");

    botao.disabled = true;

    botao.innerHTML = `
        <span class="spinner-border spinner-border-sm me-2"></span>
        Entrando...
    `;

}

</script>

</body>

</html>
